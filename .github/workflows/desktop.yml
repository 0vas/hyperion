name: Desktop installers
on:
  workflow_dispatch:
    inputs:
      notarized:
        description: Require Apple-notarized macOS distribution (fails without credentials)
        type: boolean
        default: false
  push:
    paths:
      - 'desktop/**'
      - 'src/adapters/**'
      - 'tests/desktop*'
      - 'package*.json'
      - '.github/workflows/desktop.yml'
      - '.gitattributes'
      - 'src/client/brands/hyperion.png'
      - 'src/release.json'
      - 'src/version.ts'
      - 'scripts/sync-release.mjs'
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --arm64
            executable: release/mac-arm64/Hyperion.app/Contents/MacOS/Hyperion
          - os: windows-latest
            target: --win --x64
            executable: release/win-unpacked/Hyperion.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install chromium
      - run: npm run test:desktop
      - run: npm run desktop:dist -- ${{ matrix.target }}
        env:
          HYPERION_REQUIRE_NOTARIZATION: ${{ runner.os == 'macOS' && inputs.notarized && '1' || '0' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify macOS bundle integrity
        if: runner.os == 'macOS'
        shell: bash
        env:
          HYPERION_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
          HYPERION_SIGNED: ${{ secrets.CSC_LINK != '' }}
        run: |
          HYPERION_BUNDLE="$(dirname "$(dirname "$(dirname "$HYPERION_EXECUTABLE")")")"
          codesign --verify --deep --strict --verbose=2 "$HYPERION_BUNDLE"
          if [ "$HYPERION_SIGNED" = "true" ]; then
            xcrun stapler validate "$HYPERION_BUNDLE"
            spctl --assess --type execute --verbose=2 "$HYPERION_BUNDLE"
          else
            echo "### macOS preview is NOT Apple-notarized; Gatekeeper can block it." >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm run test:desktop
        env:
          HYPERION_DISABLE_UPDATE_CHECK: '1'
          HYPERION_DESKTOP_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
      - uses: actions/upload-artifact@v7
        with:
          name: Hyperion-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
